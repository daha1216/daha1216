<svg viewBox="0 0 860 404" width="860" height="404" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 卡片纯白瓷质底板 -->
    <linearGradient id="cardPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果精细微灰边框 -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 55% 冰川透蓝环境微光 -->
    <linearGradient id="matrixAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#c7d2fe" stop-opacity="0.08" />
    </linearGradient>

    <filter id="matrixBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03" />
    </filter>
  </defs>

  <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <!-- 背景柔和冰川微光 -->
  <g clip-path="url(#matrixClip)">
    <clipPath id="matrixClip">
      <rect x="0" y="0" width="860" height="404" rx="16" />
    </clipPath>
    <circle cx="800" cy="70" r="140" fill="url(#matrixAura)" filter="url(#matrixBlur)" />
    <circle cx="60" cy="330" r="120" fill="#f0f9ff" opacity="0.6" filter="url(#matrixBlur)" />
  </g>

  <!-- ================= 第 1 行 (Row 1: y=8, height=90) ================= -->
  <!-- 1.1 dsh-pocket -->
  <g transform="translate(10, 8)">
    <rect width="415" height="90" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="16" y="14" width="82" height="24" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1" />
    <text x="57" y="30.5" class="font-sf" font-size="12.5" font-weight="700" fill="#0284c7" text-anchor="middle">移动跨端</text>
    <text x="108" y="31" class="font-sf" font-size="15" font-weight="700" fill="#0f172a">dsh-pocket</text>
    <text x="396" y="30" class="font-sf" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="end">01</text>
    <text x="16" y="56" class="font-sf" font-size="12.5" font-weight="400" fill="#334155">把 DSH 装进口袋：手机扫码即可同步操控电脑端 DSH。</text>
    <text x="16" y="74" class="font-sf" font-size="11.8" font-weight="400" fill="#64748b">局域网 / 公网直连 · 移动端抽屉布局 · 随时随地呼出控制。</text>
  </g>

  <!-- 1.2 dsh-plugin-collection -->
  <g transform="translate(435, 8)">
    <rect width="415" height="90" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="16" y="14" width="82" height="24" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="57" y="30.5" class="font-sf" font-size="12.5" font-weight="700" fill="#16a34a" text-anchor="middle">生态枢纽</text>
    <text x="108" y="31" class="font-sf" font-size="15" font-weight="700" fill="#0f172a">dsh-plugin-collection</text>
    <text x="396" y="30" class="font-sf" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="end">02</text>
    <text x="16" y="56" class="font-sf" font-size="12.5" font-weight="400" fill="#334155">DSH 第三方精选插件目录索引，官方与社区一键安装平台。</text>
    <text x="16" y="74" class="font-sf" font-size="11.8" font-weight="400" fill="#64748b">自动化更新检查 · 独立作者仓库直达 · 插件安全模块化管理。</text>
  </g>

  <!-- ================= 第 2 行 (Row 2: y=106, height=90) ================= -->
  <!-- 2.1 deepseek-harness-desktop -->
  <g transform="translate(10, 106)">
    <rect width="415" height="90" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="16" y="14" width="94" height="24" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="63" y="30.5" class="font-sf" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">桌面客户端</text>
    <text x="118" y="31" class="font-sf" font-size="15" font-weight="700" fill="#0f172a">deepseek-harness-desktop</text>
    <text x="396" y="30" class="font-sf" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="end">03</text>
    <text x="16" y="56" class="font-sf" font-size="12.5" font-weight="400" fill="#334155">专为 DSH 插件生态打造的现代化跨平台桌面级综合载体。</text>
    <text x="16" y="74" class="font-sf" font-size="11.8" font-weight="400" fill="#64748b">万物皆「插件」· 原生系统深度融合 · 沉浸丝滑开发体验。</text>
  </g>

  <!-- 2.2 billion-context-dsh -->
  <g transform="translate(435, 106)">
    <rect width="415" height="90" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="16" y="14" width="94" height="24" rx="6" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
    <text x="63" y="30.5" class="font-sf" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">上下文工程</text>
    <text x="118" y="31" class="font-sf" font-size="15" font-weight="700" fill="#0f172a">billion-context-dsh</text>
    <text x="396" y="30" class="font-sf" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="end">04</text>
    <text x="16" y="56" class="font-sf" font-size="12.5" font-weight="400" fill="#334155">Active Context Pruning (ACP) 核心动态上下文精简方案。</text>
    <text x="16" y="74" class="font-sf" font-size="11.8" font-weight="400" fill="#64748b">模型驱动自动修剪 · 杜绝盲目摘要 · 极致节省 Token 预算。</text>
  </g>

  <!-- ================= 第 3 行 (Row 3: y=204, height=90) ================= -->
  <!-- 3.1 dsh-retrace -->
  <g transform="translate(10, 204)">
    <rect width="415" height="90" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="16" y="14" width="94" height="24" rx="6" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1" />
    <text x="63" y="30.5" class="font-sf" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="middle">会话时光机</text>
    <text x="118" y="31" class="font-sf" font-size="15" font-weight="700" fill="#0f172a">dsh-retrace</text>
    <text x="396" y="30" class="font-sf" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="end">05</text>
    <text x="16" y="56" class="font-sf" font-size="12.5" font-weight="400" fill="#334155">全能历史追踪：消息智能撤回、编辑重发与重新连续生成。</text>
    <text x="16" y="74" class="font-sf" font-size="11.8" font-weight="400" fill="#64748b">分支会话自由漫游 · 工作区快照追踪 · 复杂探索零负担。</text>
  </g>

  <!-- 3.2 dsh-better-display -->
  <g transform="translate(435, 204)">
    <rect width="415" height="90" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="16" y="14" width="94" height="24" rx="6" fill="#e0f2fe" stroke="#bae6fd" stroke-width="1" />
    <text x="63" y="30.5" class="font-sf" font-size="12.5" font-weight="700" fill="#0369a1" text-anchor="middle">UI 沉浸视图</text>
    <text x="118" y="31" class="font-sf" font-size="15" font-weight="700" fill="#0f172a">dsh-better-display</text>
    <text x="396" y="30" class="font-sf" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="end">06</text>
    <text x="16" y="56" class="font-sf" font-size="12.5" font-weight="400" fill="#334155">深度阅读体验强化：执行步骤智能折叠与沉浸式交互沙箱。</text>
    <text x="16" y="74" class="font-sf" font-size="11.8" font-weight="400" fill="#64748b">智能折叠噪音工具日志 · MCP-App 沙箱深度原生嵌入展示。</text>
  </g>

  <!-- ================= 第 4 行 (Row 4: y=302, height=90) ================= -->
  <!-- 4.1 dsh-font-customizer -->
  <g transform="translate(10, 302)">
    <rect width="415" height="90" rx="13" fill="url(#cardPlate)" stroke="url(#cardBorder)" stroke-width="1.1" filter="url(#subtleShadow)" />
    <rect x="16" y="14" width="82" height="24" rx="6" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1" />
    <text x="57" y="30.5" class="font-sf" font-size="12.5" font-weight="700" fill="#db2777" text-anchor="middle">个性定制</text>
    <text x="108" y="31" class="font-sf" font-size="15" font-weight="700" fill="#0f172a">dsh-font-customizer</text>
    <text x="396" y="30" class="font-sf" font-size="13" font-weight="600" fill="#cbd5e1" text-anchor="end">07</text>
    <text x="16" y="56" class="font-sf" font-size="12.5" font-weight="400" fill="#334155">界面与代码字体定制套件，呈现极其纯粹的排版视觉美学。</text>
    <text x="16" y="74" class="font-sf" font-size="11.8" font-weight="400" fill="#64748b">系统字体智能扫描 · 实时预览热替换 · 本地持久化储存。</text>
  </g>

  <!-- 4.2 更多探索生态提示 -->
  <g transform="translate(435, 302)">
    <rect width="415" height="90" rx="13" fill="#fafbfc" stroke="#e2e8f0" stroke-width="1.1" stroke-dasharray="4 4" />
    <text x="207" y="40" class="font-sf" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Building Open-Source Ecosystem</text>
    <text x="207" y="62" class="font-sf" font-size="11.8" font-weight="400" fill="#94a3b8" text-anchor="middle">致力于打造好用、轻量、高可控的本地 AI Agent 生态体系</text>
  </g>
</svg>