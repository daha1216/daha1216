<svg viewBox="0 0 176 30" width="176" height="30" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯净纯白高雅微渐变底板 -->
    <linearGradient id="starPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- 苹果经典 1.1px 极细微灰边框 -->
    <linearGradient id="starBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 轻微悬浮微弥散投影 -->
    <filter id="starShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

  <style>
    .font-star {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- 浑然一体的圆角胶囊底板 -->
  <rect x="1" y="1" width="174" height="28" rx="14" fill="url(#starPlate)" stroke="url(#starBorder)" stroke-width="1.1" filter="url(#starShadow)" />

  <!-- 优雅金黄微光小五角星 (Star Icon) -->
  <g transform="translate(14, 7)">
    <path d="M7 0.5L9.16 4.88L14 5.58L10.5 8.99L11.33 13.8L7 11.52L2.67 13.8L3.5 8.99L0 5.58L4.84 4.88L7 0.5Z" fill="#eab308" />
  </g>

  <!-- 主文本: Star on GitHub -->
  <text x="36" y="19" class="font-star" font-size="11.5" font-weight="600" fill="#334155" letter-spacing="-0.1">
    Star on GitHub
  </text>

  <!-- 分割微点 -->
  <circle cx="129" cy="15" r="1.5" fill="#94a3b8" />

  <!-- 实时 Star 数: 67 (采用冰川透蓝高亮呈现) -->
  <text x="149" y="19" class="font-star" font-size="12" font-weight="700" fill="#0284c7" text-anchor="middle">
    67
  </text>
</svg>