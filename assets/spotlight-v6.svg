<svg viewBox="0 0 860 290" width="860" height="290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯净纯白底板 -->
    <linearGradient id="cleanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果经典 1px 浅灰极细边框 -->
    <linearGradient id="monoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 增强版苹果流光光晕（双层高饱和度漫射：青天蓝 + 浅紫罗兰 + 极淡樱花粉） -->
    <linearGradient id="vibrantAura1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.32" />
    </linearGradient>

    <linearGradient id="vibrantAura2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.18" />
    </linearGradient>

    <!-- 大范围柔焦滤镜 -->
    <filter id="strongBlur1" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="55" result="blur" />
    </filter>

    <filter id="strongBlur2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    }

    /* 光晕主层浮动呼吸 */
    @keyframes auraPulsePrimary {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.85; }
      50% { transform: scale(1.22) translate(-25px, 12px); opacity: 1; }
    }
    .primary-aura-anim {
      animation: auraPulsePrimary 8s infinite ease-in-out;
      transform-origin: 740px 60px;
    }

    /* 光晕次层交错呼吸 */
    @keyframes auraPulseSecondary {
      0%, 100% { transform: scale(1.1) translate(-10px, 5px); opacity: 0.7; }
      50% { transform: scale(0.95) translate(15px, -8px); opacity: 0.95; }
    }
    .secondary-aura-anim {
      animation: auraPulseSecondary 10s infinite ease-in-out;
      transform-origin: 660px 100px;
    }

    /* 剧情对弈双幕平滑无缝轮播 */
    @keyframes storyCross1 {
      0%, 46% { opacity: 1; transform: translateY(0); }
      49%, 97% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes storyCross2 {
      0%, 47% { opacity: 0; transform: translateY(4px); }
      50%, 96% { opacity: 1; transform: translateY(0); }
      99%, 100% { opacity: 0; transform: translateY(4px); }
    }

    .story-1 { animation: storyCross1 12s infinite ease-in-out; }
    .story-2 { animation: storyCross2 12s infinite ease-in-out; }

    /* 状态呼吸指示点 */
    @keyframes livePulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .live-dot {
      animation: livePulse 2.6s infinite ease-in-out;
      transform-origin: 48px 40px;
    }
  </style>

  <!-- 纯白亮色主卡片背景 -->
  <rect x="2" y="2" width="856" height="286" rx="18" fill="url(#cleanBg)" stroke="url(#monoBorder)" stroke-width="1" />

  <!-- 增强型双层饱满呼吸光晕（右上角强力漫射，层次分明） -->
  <g clip-path="url(#auraClip)">
    <clipPath id="auraClip">
      <rect x="2" y="2" width="856" height="286" rx="18" />
    </clipPath>
    <!-- 第一层：超大范围主弥散光 -->
    <circle cx="740" cy="60" r="200" fill="url(#vibrantAura1)" filter="url(#strongBlur1)" class="primary-aura-anim" />
    <!-- 第二层：核心高亮轻柔彩晕 -->
    <circle cx="680" cy="90" r="140" fill="url(#vibrantAura2)" filter="url(#strongBlur2)" class="secondary-aura-anim" />
    <!-- 左下角微弱呼应极淡冷光 -->
    <circle cx="80" cy="240" r="90" fill="#e0f2fe" opacity="0.45" filter="url(#strongBlur2)" />
  </g>

  <!-- 顶栏状态指示胶囊 -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="136" height="24" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#0284c7" class="live-dot" />
    <text x="24" y="16" class="font-sf" font-size="11" font-weight="600" fill="#475569" letter-spacing="0.5">NARRATIVE ENGINE</text>
  </g>

  <!-- 顶栏右侧极简标识 -->
  <text x="824" y="44" text-anchor="end" class="font-sf" font-size="12" font-weight="500" fill="#64748b">52 Worlds · Zero Drift</text>

  <!-- 大标题与副标题 -->
  <text x="36" y="90" class="font-sf" font-size="26" font-weight="700" fill="#0f172a" letter-spacing="-0.5">dsh-adult-tension</text>
  <text x="36" y="116" class="font-sf" font-size="13.5" font-weight="400" fill="#64748b" letter-spacing="-0.1">
    高张力互动叙事 · 拒绝迎合的活人感 NPC · 18+ 深度破甲与长线世界推演
  </text>

  <!-- 次级展台（高透白玻璃底板，衬托光晕层次） -->
  <rect x="36" y="138" width="788" height="88" rx="10" fill="#ffffff" fill-opacity="0.92" stroke="#e2e8f0" stroke-width="1" />

  <!-- 场景一：盛唐长安 剧情切片 -->
  <g class="story-1 font-sf">
    <text x="54" y="168" font-size="12.5" font-weight="600" fill="#0f172a">盛唐长安 · 沈青澜</text>
    <text x="180" y="168" font-size="13" font-weight="400" fill="#1e293b">“今夜值守的明明不是你……站住。”（身后门闩已被她悄悄扣死）</text>

    <text x="54" y="202" font-size="12" font-weight="500" fill="#64748b">抉择与推演</text>
    <text x="136" y="202" font-size="12.5" font-weight="400" fill="#334155">近身按住门板要求暗账。NPC 触发利益防卫拒绝顺从，巡夜禁军正向此走来...</text>
  </g>

  <!-- 场景二：赛博边缘 利益博弈 -->
  <g class="story-2 font-sf">
    <text x="54" y="168" font-size="12.5" font-weight="600" fill="#0f172a">赛博街区 · 边缘终端</text>
    <text x="194" y="168" font-size="13" font-weight="400" fill="#1e293b">“接入协议失效了，你要的信息在我脑子里，别拿空支票糊弄我。”</text>

    <text x="54" y="202" font-size="12" font-weight="500" fill="#64748b">抉择与推演</text>
    <text x="136" y="202" font-size="12.5" font-weight="400" fill="#334155">全维 YAML 状态机无损沉淀立场变动，离屏推演机制持续追踪终端信号源...</text>
  </g>

  <!-- 底部 4 个纯净极简药丸胶囊 -->
  <g transform="translate(36, 246)" class="font-sf" font-size="12">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="132" height="26" rx="13" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="1" />
    <text x="66" y="17" fill="#334155" text-anchor="middle" font-weight="500">活人感独立意志</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="140" height="26" rx="13" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="1" />
    <text x="212" y="17" fill="#334155" text-anchor="middle" font-weight="500">52 套深度世界库</text>

    <!-- Tag 3 -->
    <rect x="292" y="0" width="140" height="26" rx="13" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="1" />
    <text x="362" y="17" fill="#334155" text-anchor="middle" font-weight="500">18+ 深度语境脱敏</text>

    <!-- Tag 4 -->
    <rect x="442" y="0" width="144" height="26" rx="13" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="1" />
    <text x="514" y="17" fill="#334155" text-anchor="middle" font-weight="500">零漂移 YAML 状态机</text>
  </g>
</svg>