<svg viewBox="0 0 860 290" width="860" height="290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯净纯白底板 -->
    <linearGradient id="cleanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fcfcfd" />
    </linearGradient>

    <!-- 苹果经典 1px 浅灰极细边框 -->
    <linearGradient id="monoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e4e4e7" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>

    <!-- 极轻柔的灰白微光（无彩色杂光） -->
    <linearGradient id="subtleAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>
  </defs>

  <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
    }

    /* 剧情对弈双幕平滑无缝轮播 */
    @keyframes storyCross1 {
      0%, 46% { opacity: 1; transform: translateY(0); }
      49%, 97% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes storyCross2 {
      0%, 47% { opacity: 0; transform: translateY(4px); }
      50%, 96% { opacity: 1; transform: translateY(0); }
      99%, 100% { opacity: 0; transform: translateY(4px); }
    }

    .story-1 { animation: storyCross1 12s infinite ease-in-out; }
    .story-2 { animation: storyCross2 12s infinite ease-in-out; }

    /* 极简灰度状态呼吸 */
    @keyframes monoPulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 0.85; transform: scale(1.1); }
    }
    .pulse-dot {
      animation: monoPulse 3s infinite ease-in-out;
      transform-origin: 48px 40px;
    }
  </style>

  <!-- 纯白亮色主卡片背景 -->
  <rect x="2" y="2" width="856" height="286" rx="18" fill="url(#cleanBg)" stroke="url(#monoBorder)" stroke-width="1" />

  <!-- 柔和无彩微晕（仅黑白灰漫射） -->
  <g clip-path="url(#monoClip)">
    <clipPath id="monoClip">
      <rect x="2" y="2" width="856" height="286" rx="18" />
    </clipPath>
    <circle cx="740" cy="60" r="140" fill="url(#subtleAura)" filter="url(#softBlur)" />
  </g>

  <!-- 顶栏状态指示胶囊（极简灰白） -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="136" height="24" rx="12" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#71717a" class="pulse-dot" />
    <text x="24" y="16" class="font-sf" font-size="11" font-weight="600" fill="#52525b" letter-spacing="0.5">NARRATIVE ENGINE</text>
  </g>

  <!-- 顶栏右侧极简标识 -->
  <text x="824" y="44" text-anchor="end" class="font-sf" font-size="12" font-weight="500" fill="#a1a1aa">52 Worlds · Zero Drift</text>

  <!-- 大标题与副标题（纯黑与高质感石墨灰） -->
  <text x="36" y="90" class="font-sf" font-size="26" font-weight="700" fill="#18181b" letter-spacing="-0.5">dsh-adult-tension</text>
  <text x="36" y="116" class="font-sf" font-size="13.5" font-weight="400" fill="#71717a" letter-spacing="-0.1">
    高张力互动叙事 · 拒绝迎合的活人感 NPC · 18+ 深度破甲与长线世界推演
  </text>

  <!-- 次级展台（纯净浅灰微框，无任何杂色） -->
  <rect x="36" y="138" width="788" height="88" rx="10" fill="#fcfcfd" stroke="#e4e4e7" stroke-width="1" />

  <!-- 场景一：盛唐长安 剧情切片 -->
  <g class="story-1 font-sf">
    <text x="54" y="168" font-size="12.5" font-weight="600" fill="#18181b">盛唐长安 · 沈青澜</text>
    <text x="180" y="168" font-size="13" font-weight="400" fill="#27272a">“今夜值守的明明不是你……站住。”（身后门闩已被她悄悄扣死）</text>

    <text x="54" y="202" font-size="12" font-weight="500" fill="#a1a1aa">抉择与推演</text>
    <text x="136" y="202" font-size="12.5" font-weight="400" fill="#52525b">近身按住门板要求暗账。NPC 触发利益防卫拒绝顺从，巡夜禁军正向此走来...</text>
  </g>

  <!-- 场景二：赛博边缘 利益博弈 -->
  <g class="story-2 font-sf">
    <text x="54" y="168" font-size="12.5" font-weight="600" fill="#18181b">赛博街区 · 边缘终端</text>
    <text x="194" y="168" font-size="13" font-weight="400" fill="#27272a">“接入协议失效了，你要的信息在我脑子里，别拿空支票糊弄我。”</text>

    <text x="54" y="202" font-size="12" font-weight="500" fill="#a1a1aa">抉择与推演</text>
    <text x="136" y="202" font-size="12.5" font-weight="400" fill="#52525b">全维 YAML 状态机无损沉淀立场变动，离屏推演机制持续追踪终端信号源...</text>
  </g>

  <!-- 底部 4 个纯净极简药丸胶囊（统一石墨灰与细边，无任何杂彩） -->
  <g transform="translate(36, 246)" class="font-sf" font-size="12">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="132" height="26" rx="13" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
    <text x="66" y="17" fill="#3f3f46" text-anchor="middle" font-weight="500">活人感独立意志</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="140" height="26" rx="13" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
    <text x="212" y="17" fill="#3f3f46" text-anchor="middle" font-weight="500">52 套深度世界库</text>

    <!-- Tag 3 -->
    <rect x="292" y="0" width="140" height="26" rx="13" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
    <text x="362" y="17" fill="#3f3f46" text-anchor="middle" font-weight="500">18+ 深度语境脱敏</text>

    <!-- Tag 4 -->
    <rect x="442" y="0" width="144" height="26" rx="13" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
    <text x="514" y="17" fill="#3f3f46" text-anchor="middle" font-weight="500">零漂移 YAML 状态机</text>
  </g>
</svg>