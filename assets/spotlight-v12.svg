<svg viewBox="0 0 860 290" width="860" height="290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯净纯白底板 -->
    <linearGradient id="cleanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果经典 1px 浅灰极细边框 -->
    <linearGradient id="monoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 精确 55% 冰川透蓝 + 45% 晨曦淡紫粉光晕 -->
    <linearGradient id="balancedAura1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16" />
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.15" />
      <stop offset="55%" stop-color="#bae6fd" stop-opacity="0.13" />
      <stop offset="78%" stop-color="#c7d2fe" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0.09" />
    </linearGradient>

    <linearGradient id="balancedAura2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" stop-opacity="0.08" />
      <stop offset="45%" stop-color="#c4b5fd" stop-opacity="0.10" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.12" />
    </linearGradient>

    <filter id="softDiffusion" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="48" result="blur" />
    </filter>
  </defs>

  <style>
        .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "PingFang SC", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    .font-mono {
      font-family: "JetBrains Mono", "SF Mono", "Fira Code", "Cascadia Code", "Menlo", "Consolas", monospace;
      letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
    }

    /* 55% 冰川晨曦光晕轻柔呼吸 */
    @keyframes glacierFloat1 {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.8; }
      50% { transform: scale(1.15) translate(-20px, 10px); opacity: 1; }
    }
    .glacier-anim-1 {
      animation: glacierFloat1 9s infinite ease-in-out;
      transform-origin: 730px 65px;
    }

    @keyframes glacierFloat2 {
      0%, 100% { transform: scale(1.1) translate(-10px, 5px); opacity: 0.65; }
      50% { transform: scale(0.95) translate(15px, -5px); opacity: 0.95; }
    }
    .glacier-anim-2 {
      animation: glacierFloat2 11s infinite ease-in-out;
      transform-origin: 670px 90px;
    }

    /* 剧情对弈双幕平滑无缝轮播 */
    @keyframes storyCross1 {
      0%, 46% { opacity: 1; transform: translateY(0); }
      49%, 97% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes storyCross2 {
      0%, 47% { opacity: 0; transform: translateY(4px); }
      50%, 96% { opacity: 1; transform: translateY(0); }
      99%, 100% { opacity: 0; transform: translateY(4px); }
    }

    .story-1 { animation: storyCross1 12s infinite ease-in-out; }
    .story-2 { animation: storyCross2 12s infinite ease-in-out; }

    /* 状态指示点轻柔冰蓝呼吸 */
    @keyframes livePulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .live-dot {
      animation: livePulse 2.6s infinite ease-in-out;
      transform-origin: 48px 40px;
    }
  </style>

  <!-- 纯白亮色主卡片背景 -->
  <rect x="2" y="2" width="856" height="286" rx="18" fill="url(#cleanBg)" stroke="url(#monoBorder)" stroke-width="1" />

  <!-- 55% 冰川晨曦呼吸光晕 -->
  <g clip-path="url(#auraClip)">
    <clipPath id="auraClip">
      <rect x="2" y="2" width="856" height="286" rx="18" />
    </clipPath>
    <circle cx="740" cy="60" r="190" fill="url(#balancedAura1)" filter="url(#softDiffusion)" class="glacier-anim-1" />
    <circle cx="670" cy="85" r="140" fill="url(#balancedAura2)" filter="url(#softDiffusion)" class="glacier-anim-2" />
  </g>

  <!-- 顶栏状态指示胶囊 -->
  <g transform="translate(36, 28)">
    <rect x="0" y="0" width="136" height="24" rx="12" fill="#ffffff" fill-opacity="0.9" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#38bdf8" class="live-dot" />
    <text x="24" y="16" class="font-mono" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="0.5">NARRATIVE ENGINE</text>
  </g>

  <!-- 顶栏右侧极简标识 -->
  <text x="824" y="44" text-anchor="end" class="font-mono" font-size="11.5" font-weight="500" fill="#94a3b8">52 Worlds · Zero Drift</text>

  <!-- 大标题与副标题 -->
  <text x="36" y="90" class="font-sf" font-size="26" font-weight="700" fill="#0f172a" letter-spacing="-0.5">dsh-adult-tension</text>
  <text x="36" y="116" class="font-sf" font-size="13.5" font-weight="400" fill="#64748b" letter-spacing="-0.1">
    高张力互动叙事 · 拒绝迎合的活人感 NPC · 18+ 深度破甲与长线世界推演
  </text>

  <!-- 次级展台（纯白透亮底板） -->
  <rect x="36" y="138" width="788" height="88" rx="10" fill="#ffffff" fill-opacity="0.95" stroke="#e2e8f0" stroke-width="1" />

  <!-- 场景一：盛唐暗流 权谋对弈 (方案 1) -->
  <g class="story-1 font-sf">
    <rect x="52" y="152" width="124" height="20" rx="5" fill="#f0f9ff" stroke="#bae6fd" stroke-width="0.8" />
    <text x="114" y="166" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">盛唐暗流 · 沈青澜</text>
    <text x="188" y="167" font-size="13" font-weight="400" fill="#1e293b">“门我已经反锁了……今夜你要查的卷宗，得拿你自己来换。”</text>

    <rect x="52" y="188" width="78" height="20" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="91" y="202" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">底线博弈</text>
    <text x="142" y="203" font-size="12.5" font-weight="400" fill="#334155">拒绝机械顺从。NPC 判定利益侵蚀触发防卫拉扯，心跳与戒备指数实时重构...</text>
  </g>

  <!-- 场景二：边缘终端 利益与背叛 (方案 1) -->
  <g class="story-2 font-sf">
    <rect x="52" y="152" width="132" height="20" rx="5" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="0.8" />
    <text x="118" y="166" font-size="11" font-weight="600" fill="#7c3aed" text-anchor="middle">边缘终端 · 荒原黑客</text>
    <text x="196" y="167" font-size="13" font-weight="400" fill="#1e293b">“别用那种眼神看我，在底层活命靠的是底牌，不是廉价的信任。”</text>

    <rect x="52" y="188" width="78" height="20" rx="5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
    <text x="91" y="202" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">动态立场</text>
    <text x="142" y="203" font-size="12.5" font-weight="400" fill="#334155">离屏长线推演机制。信任值每落后一步，黑市监听与反噬风险同步指数攀升...</text>
  </g>

  <!-- 底部 4 个纯净极简药丸胶囊 -->
  <g transform="translate(36, 246)" class="font-sf" font-size="12">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="132" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="66" y="17" fill="#334155" text-anchor="middle" font-weight="500">活人感独立意志</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="140" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="212" y="17" fill="#334155" text-anchor="middle" font-weight="500">52 套深度世界库</text>

    <!-- Tag 3 -->
    <rect x="292" y="0" width="140" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="362" y="17" fill="#334155" text-anchor="middle" font-weight="500">18+ 深度语境脱敏</text>

    <!-- Tag 4 -->
    <rect x="442" y="0" width="144" height="26" rx="13" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="514" y="17" fill="#334155" text-anchor="middle" font-weight="500">零漂移 YAML 状态机</text>
  </g>
</svg>