<svg viewBox="0 0 860 300" width="860" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 苹果纯净浅色微渐变底板 -->
    <linearGradient id="whitePlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- 苹果极细高雅浅灰边框 -->
    <linearGradient id="lightBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- 苹果明亮彩色柔和光晕（晨曦彩虹感，轻柔通透） -->
    <linearGradient id="softAura" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.25" />
    </linearGradient>

    <filter id="lightBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- 柔和浅灰内嵌展板底色 -->
    <linearGradient id="innerPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.75" />
    </linearGradient>
  </defs>

  <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* 苹果晨曦光晕轻微漂浮呼吸 */
    @keyframes lightFloat {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.8; }
      50% { transform: scale(1.1) translate(-15px, 8px); opacity: 1; }
    }
    .aura-anim {
      animation: lightFloat 9s infinite ease-in-out;
      transform-origin: 720px 80px;
    }

    /* 剧情对弈字幕平滑淡入淡出 */
    @keyframes fadeText1 {
      0%, 3% { opacity: 0; transform: translateY(5px); }
      8%, 44% { opacity: 1; transform: translateY(0); }
      49%, 100% { opacity: 0; transform: translateY(-5px); }
    }
    @keyframes fadeText2 {
      0%, 50% { opacity: 0; transform: translateY(5px); }
      55%, 92% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; transform: translateY(-5px); }
    }

    .act-1 { animation: fadeText1 14s infinite ease-in-out; }
    .act-2 { animation: fadeText2 14s infinite ease-in-out; }

    /* 柔和绿点呼吸 */
    @keyframes greenBreathe {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .live-dot {
      animation: greenBreathe 2.5s infinite ease-in-out;
    }
  </style>

  <!-- 浅色大卡片底色与微投影 -->
  <rect x="2" y="2" width="856" height="296" rx="20" fill="url(#whitePlate)" stroke="url(#lightBorder)" stroke-width="1.5" />

  <!-- 苹果晨曦柔和彩色漫射光（右上方漂浮） -->
  <g clip-path="url(#plateClip)">
    <clipPath id="plateClip">
      <rect x="2" y="2" width="856" height="296" rx="20" />
    </clipPath>
    <circle cx="730" cy="70" r="150" fill="url(#softAura)" filter="url(#lightBlur)" class="aura-anim" />
    <circle cx="90" cy="240" r="100" fill="#e0e7ff" opacity="0.4" filter="url(#lightBlur)" />
  </g>

  <!-- 顶栏状态小胶囊 -->
  <g transform="translate(36, 30)">
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#10b981" class="live-dot" />
    <text x="24" y="16" class="font-sf" font-size="11" font-weight="600" fill="#475569" letter-spacing="0.5">NARRATIVE ENGINE</text>
  </g>

  <text x="824" y="47" text-anchor="end" class="font-sf" font-size="12" font-weight="500" fill="#94a3b8">52 Worlds · Zero Drift</text>

  <!-- 标题与副标题（深灰与雅致中灰） -->
  <text x="36" y="96" class="font-sf" font-size="28" font-weight="700" fill="#0f172a" letter-spacing="-0.5">dsh-adult-tension</text>
  <text x="36" y="124" class="font-sf" font-size="14" font-weight="400" fill="#64748b" letter-spacing="-0.2">
    高张力互动叙事 · 拒绝迎合的活人感 NPC · 18+ 深度破甲与长线世界推演
  </text>

  <!-- 次级磨砂展台内框 -->
  <rect x="36" y="148" width="788" height="88" rx="12" fill="url(#innerPlate)" stroke="#e2e8f0" stroke-width="1" />

  <!-- 场景一：盛唐长安 剧情切片 -->
  <g class="act-1 font-sf">
    <text x="56" y="182" font-size="13" font-weight="600" fill="#e11d48">盛唐长安 · 沈青澜</text>
    <text x="180" y="182" font-size="13" font-weight="400" fill="#1e293b">“今夜值守的明明不是你……站住。”（身后门闩已被她悄悄扣死）</text>
    <text x="56" y="212" font-size="13" font-weight="600" fill="#64748b">抉择与推演</text>
    <text x="142" y="212" font-size="13" font-weight="400" fill="#475569">反手按紧门板逼近要求暗账。NPC 触发利益防卫拒绝盲从，巡夜禁军正向此走来...</text>
  </g>

  <!-- 场景二：赛博边缘 利益博弈 -->
  <g class="act-2 font-sf">
    <text x="56" y="182" font-size="13" font-weight="600" fill="#7c3aed">赛博街区 · 边缘终端</text>
    <text x="194" y="182" font-size="13" font-weight="400" fill="#1e293b">“接入协议失效了，你要的信息在我脑子里，别拿空支票糊弄我。”</text>
    <text x="56" y="212" font-size="13" font-weight="600" fill="#64748b">抉择与推演</text>
    <text x="142" y="212" font-size="13" font-weight="400" fill="#475569">全维 YAML 状态机无损记录立场变动，离屏推演持续追踪终端信号源...</text>
  </g>

  <!-- 底部优雅浅色药丸胶囊 -->
  <g transform="translate(36, 256)" class="font-sf" font-size="12">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="132" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="66" y="17" fill="#334155" text-anchor="middle" font-weight="500">活人感独立意志</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="140" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="212" y="17" fill="#334155" text-anchor="middle" font-weight="500">52 套深度世界库</text>

    <!-- Tag 3 -->
    <rect x="292" y="0" width="140" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="362" y="17" fill="#334155" text-anchor="middle" font-weight="500">18+ 深度语境脱敏</text>

    <!-- Tag 4 -->
    <rect x="442" y="0" width="144" height="26" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="514" y="17" fill="#334155" text-anchor="middle" font-weight="500">零漂移 YAML 状态机</text>
  </g>
</svg>