<svg viewBox="0 0 860 300" width="860" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 苹果风格深灰暗色多层渐变底板 -->
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#121214" />
    </linearGradient>

    <!-- 苹果经典的细腻微光外边框 -->
    <linearGradient id="appleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>

    <!-- 柔和电影级彩虹流光（Apple Intelligence 风格柔光渐变） -->
    <linearGradient id="appleGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff375f" stop-opacity="0.6" />
      <stop offset="25%" stop-color="#ff9f0a" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#bf5af2" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#5e5ce6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0.6" />
    </linearGradient>

    <!-- 柔和毛玻璃内发光滤镜 -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- 渐变文字填充 -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a1a1aa" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf5af2" />
      <stop offset="100%" stop-color="#5e5ce6" />
    </linearGradient>
  </defs>

  <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* Apple 风格流光呼吸光环 */
    @keyframes appleAura {
      0%, 100% { opacity: 0.35; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.65; transform: scale(1.08) translate(-10px, 5px); }
    }
    .aura-circle {
      animation: appleAura 8s infinite ease-in-out;
      transform-origin: 700px 100px;
    }

    /* 剧情切片优雅淡入淡出轮播 */
    @keyframes fadeStory1 {
      0%, 3% { opacity: 0; transform: translateY(6px); }
      8%, 44% { opacity: 1; transform: translateY(0); }
      49%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes fadeStory2 {
      0%, 50% { opacity: 0; transform: translateY(6px); }
      55%, 92% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; transform: translateY(-6px); }
    }

    .story-act-1 { animation: fadeStory1 14s infinite ease-in-out; }
    .story-act-2 { animation: fadeStory2 14s infinite ease-in-out; }

    /* 极简流光呼吸边角指示 */
    @keyframes breatheDot {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .dot-breathe {
      animation: breatheDot 3s infinite ease-in-out;
    }
  </style>

  <!-- 背景磨砂圆角卡片 -->
  <rect x="2" y="2" width="856" height="296" rx="20" fill="url(#appleBg)" stroke="url(#appleBorder)" stroke-width="1" />

  <!-- 柔和的 Apple 动态环境彩晕 (Ambient Aura) -->
  <g clip-path="url(#cardClip)">
    <clipPath id="cardClip">
      <rect x="2" y="2" width="856" height="296" rx="20" />
    </clipPath>
    <circle cx="720" cy="70" r="140" fill="url(#appleGlowGrad)" filter="url(#softGlow)" class="aura-circle" />
    <circle cx="100" cy="240" r="120" fill="#bf5af2" opacity="0.15" filter="url(#softGlow)" />
  </g>

  <!-- 顶部轻奢小胶囊状态 Tag -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1" />
    <circle cx="12" cy="12" r="3.5" fill="#30d158" class="dot-breathe" />
    <text x="24" y="16" class="font-sf" font-size="11" font-weight="500" fill="#ffffff" fill-opacity="0.9" letter-spacing="0.5">NARRATIVE ENGINE</text>
  </g>

  <text x="824" y="48" text-anchor="end" class="font-sf" font-size="12" font-weight="400" fill="#86868b">52 Worlds · Zero Drift</text>

  <!-- 苹果大标题排版 -->
  <text x="36" y="98" class="font-sf" font-size="28" font-weight="700" fill="url(#textGrad)" letter-spacing="-0.8">dsh-adult-tension</text>
  <text x="36" y="126" class="font-sf" font-size="14" font-weight="400" fill="#a1a1a6" letter-spacing="-0.2">
    高张力互动叙事 · 拒绝迎合的活人感 NPC · 18+ 深度破甲与长线世界推演
  </text>

  <!-- 剧本展台：极简磨砂次级展板 -->
  <rect x="36" y="150" width="788" height="88" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06" />

  <!-- 场景一：盛唐长安 戏剧对峙 -->
  <g class="story-act-1 font-sf">
    <text x="56" y="184" font-size="13" font-weight="600" fill="#ff375f">盛唐长安 · 沈青澜</text>
    <text x="180" y="184" font-size="13" font-weight="400" fill="#f5f5f7">“今夜值守的明明不是你……站住。”（身后门闩已被她悄悄扣死）</text>
    <text x="56" y="214" font-size="13" font-weight="600" fill="#a1a1a6">抉择与推演</text>
    <text x="142" y="214" font-size="13" font-weight="400" fill="#86868b">反手按紧门板逼近要求暗账。NPC 触发利益防卫拒绝盲从，巡夜禁军正向此走来...</text>
  </g>

  <!-- 场景二：赛博边缘 利益博弈 -->
  <g class="story-act-2 font-sf">
    <text x="56" y="184" font-size="13" font-weight="600" fill="#bf5af2">赛博街区 · 边缘终端</text>
    <text x="194" y="184" font-size="13" font-weight="400" fill="#f5f5f7">“接入协议失效了，你要的信息在我脑子里，别拿空支票糊弄我。”</text>
    <text x="56" y="214" font-size="13" font-weight="600" fill="#a1a1a6">抉择与推演</text>
    <text x="142" y="214" font-size="13" font-weight="400" fill="#86868b">全维 YAML 状态机无损记录立场变动，离屏推演持续追踪终端信号源...</text>
  </g>

  <!-- 底部优雅药丸特性标签 -->
  <g transform="translate(36, 256)" class="font-sf" font-size="12">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="136" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="68" y="17" fill="#f5f5f7" text-anchor="middle" font-weight="500">活人感独立意志</text>

    <!-- Tag 2 -->
    <rect x="146" y="0" width="144" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="218" y="17" fill="#f5f5f7" text-anchor="middle" font-weight="500">52 套深度世界库</text>

    <!-- Tag 3 -->
    <rect x="300" y="0" width="144" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="372" y="17" fill="#f5f5f7" text-anchor="middle" font-weight="500">18+ 深度语境脱敏</text>

    <!-- Tag 4 -->
    <rect x="454" y="0" width="144" height="26" rx="13" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="526" y="17" fill="#f5f5f7" text-anchor="middle" font-weight="500">零漂移 YAML 状态机</text>
  </g>
</svg>