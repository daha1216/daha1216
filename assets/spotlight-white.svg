<svg viewBox="0 0 860 300" width="860" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 苹果纯亮浅白极简底板 -->
    <linearGradient id="pureWhiteBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fafbfc" />
    </linearGradient>

    <!-- 苹果极细高雅浅淡边框 -->
    <linearGradient id="subtleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>

    <!-- 极轻透的晨曦光晕（轻粉轻紫天蓝，透明度降至极淡的 15%~20%，透亮不暗） -->
    <linearGradient id="airyAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="35%" stop-color="#a78bfa" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#f472b6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.15" />
    </linearGradient>

    <filter id="softDiffusal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="45" result="blur" />
    </filter>

    <!-- 内嵌展台纯白透底 -->
    <linearGradient id="innerWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    /* 极轻透光晕轻柔舒展呼吸动效 */
    @keyframes auraBreathe {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.7; }
      50% { transform: scale(1.15) translate(-20px, 10px); opacity: 1; }
    }
    .airy-aura-anim {
      animation: auraBreathe 10s infinite ease-in-out;
      transform-origin: 730px 80px;
    }

    /* 剧情对弈双幕平滑淡入淡出字幕 */
    @keyframes storyFade1 {
      0%, 3% { opacity: 0; transform: translateY(4px); }
      8%, 44% { opacity: 1; transform: translateY(0); }
      49%, 100% { opacity: 0; transform: translateY(-4px); }
    }
    @keyframes storyFade2 {
      0%, 50% { opacity: 0; transform: translateY(4px); }
      55%, 92% { opacity: 1; transform: translateY(0); }
      97%, 100% { opacity: 0; transform: translateY(-4px); }
    }

    .story-1 { animation: storyFade1 14s infinite ease-in-out; }
    .story-2 { animation: storyFade2 14s infinite ease-in-out; }

    /* 优雅清爽绿点呼吸 */
    @keyframes cleanPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .clean-dot {
      animation: cleanPulse 2.8s infinite ease-in-out;
    }
  </style>

  <!-- 纯白亮色主卡片背景与极轻微浅灰边线 -->
  <rect x="2" y="2" width="856" height="296" rx="20" fill="url(#pureWhiteBg)" stroke="url(#subtleBorder)" stroke-width="1.5" />

  <!-- 柔和晨曦环境漫射彩晕（通透浅亮，绝不泛暗） -->
  <g clip-path="url(#cardClipLight)">
    <clipPath id="cardClipLight">
      <rect x="2" y="2" width="856" height="296" rx="20" />
    </clipPath>
    <circle cx="730" cy="70" r="170" fill="url(#airyAura)" filter="url(#softDiffusal)" class="airy-aura-anim" />
    <circle cx="80" cy="240" r="110" fill="#f0f9ff" opacity="0.8" filter="url(#softDiffusal)" />
  </g>

  <!-- 顶栏状态指示胶囊（纯净浅白微灰） -->
  <g transform="translate(36, 30)">
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1" />
    <circle cx="12" cy="12" r="3.5" fill="#10b981" class="clean-dot" />
    <text x="24" y="16" class="font-sf" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.5">NARRATIVE ENGINE</text>
  </g>

  <text x="824" y="47" text-anchor="end" class="font-sf" font-size="12" font-weight="500" fill="#9ca3af">52 Worlds · Zero Drift</text>

  <!-- 标题与副标题 -->
  <text x="36" y="96" class="font-sf" font-size="28" font-weight="700" fill="#111827" letter-spacing="-0.5">dsh-adult-tension</text>
  <text x="36" y="124" class="font-sf" font-size="14" font-weight="400" fill="#6b7280" letter-spacing="-0.2">
    高张力互动叙事 · 拒绝迎合的活人感 NPC · 18+ 深度破甲与长线世界推演
  </text>

  <!-- 次级展台（纯白透底配超细浅灰线） -->
  <rect x="36" y="148" width="788" height="88" rx="12" fill="url(#innerWhite)" stroke="#e5e7eb" stroke-width="1" />

  <!-- 场景一：盛唐长安 剧情切片 -->
  <g class="story-1 font-sf">
    <text x="56" y="182" font-size="13" font-weight="600" fill="#e11d48">盛唐长安 · 沈青澜</text>
    <text x="180" y="182" font-size="13" font-weight="400" fill="#1f2937">“今夜值守的明明不是你……站住。”（身后门闩已被她悄悄扣死）</text>
    <text x="56" y="212" font-size="13" font-weight="600" fill="#6b7280">抉择与推演</text>
    <text x="142" y="212" font-size="13" font-weight="400" fill="#4b5563">反手按紧门板逼近要求暗账。NPC 触发利益防卫拒绝盲从，巡夜禁军正向此走来...</text>
  </g>

  <!-- 场景二：赛博边缘 利益博弈 -->
  <g class="story-2 font-sf">
    <text x="56" y="182" font-size="13" font-weight="600" fill="#8b5cf6">赛博街区 · 边缘终端</text>
    <text x="194" y="182" font-size="13" font-weight="400" fill="#1f2937">“接入协议失效了，你要的信息在我脑子里，别拿空支票糊弄我。”</text>
    <text x="56" y="212" font-size="13" font-weight="600" fill="#6b7280">抉择与推演</text>
    <text x="142" y="212" font-size="13" font-weight="400" fill="#4b5563">全维 YAML 状态机无损记录立场变动，离屏推演持续追踪终端信号源...</text>
  </g>

  <!-- 底部浅白药丸胶囊 -->
  <g transform="translate(36, 256)" class="font-sf" font-size="12">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="132" height="26" rx="13" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="66" y="17" fill="#374151" text-anchor="middle" font-weight="500">活人感独立意志</text>

    <!-- Tag 2 -->
    <rect x="142" y="0" width="140" height="26" rx="13" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="212" y="17" fill="#374151" text-anchor="middle" font-weight="500">52 套深度世界库</text>

    <!-- Tag 3 -->
    <rect x="292" y="0" width="140" height="26" rx="13" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="362" y="17" fill="#374151" text-anchor="middle" font-weight="500">18+ 深度语境脱敏</text>

    <!-- Tag 4 -->
    <rect x="442" y="0" width="144" height="26" rx="13" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="514" y="17" fill="#374151" text-anchor="middle" font-weight="500">零漂移 YAML 状态机</text>
  </g>
</svg>