<svg viewBox="0 0 290 38" width="290" height="38" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 纯净纯白高雅底板 -->
    <linearGradient id="btnPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <linearGradient id="btnBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 极轻微苹果悬浮投影 -->
    <filter id="btnShadowLight" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.04" />
    </filter>
  </defs>

    <style>
    .font-sf {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
  </style>

  <!-- 紧凑圆角胶囊底板 (rx=19) -->
  <rect x="1.5" y="1.5" width="287" height="35" rx="17.5" fill="url(#btnPlate)" stroke="url(#btnBorderGrad)" stroke-width="1.2" filter="url(#btnShadowLight)" />

  <!-- 居中紧凑成组的文字与箭头 -->
  <g transform="translate(145, 19)">
    <!-- 探索指南文字 (向左微调，给右侧箭头留出视觉对称) -->
    <text x="-8" y="4.5" class="btn-text" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" letter-spacing="-0.1">
      探索 52 套世界与交互指南
    </text>

    <!-- 紧跟在文字右侧的精巧冰蓝小箭头 -->
    <g transform="translate(95, -5)" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="0" y1="5" x2="10" y2="5" />
      <polyline points="6 1 10 5 6 9" />
    </g>
  </g>
</svg>